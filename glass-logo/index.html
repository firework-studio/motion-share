<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>玻璃 Logo</title>
    <style>
      html, body { margin: 0; height: 100%; background: var(--bg, #000); overflow: hidden; font: 13px/1.2 "PingFang SC", system-ui, sans-serif; color: #c9c4bf; }
      #gl { position: fixed; left: 50%; top: 50%; width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; transform: translate(-50%, -50%); cursor: pointer; }
      #bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(8px); }
      #bar button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25); padding: 0; cursor: pointer; }
      #bar button.on { outline: 2px solid #fff; outline-offset: 2px; }
      #bar span { margin-left: 6px; opacity: 0.7; white-space: nowrap; }
      #credit { position: fixed; right: 16px; bottom: 12px; font-size: 12px; color: #6b6560; text-decoration: none; }
    </style>
  </head>
  <body>
    <canvas id="gl" width="1920" height="1080"></canvas>
    <div id="bar"></div>
    <a id="credit" href="https://github.com/firework-studio/motion-share" target="_blank" rel="noopener">Made by Firework 工作室</a>
    <script src="main.js"></script>
    <script>
      // colours: the glass's fringes (rainbow, or one tint) and the page behind
      const SETS = [
        { name: "彩虹", swatch: "conic-gradient(#f5c84a, #ff5a3d, #8a5cff, #3d9bff, #f5c84a)", tint: [1, 1, 1], mix: 0, bg: "#000000" },
        { name: "冰蓝", swatch: "#4aa8ff", tint: [0.35, 0.7, 1], mix: 1, bg: "#03070d" },
        { name: "玫瑰", swatch: "#ff6f9e", tint: [1, 0.42, 0.62], mix: 1, bg: "#0b0306" },
        { name: "香槟金", swatch: "#e9b85c", tint: [1, 0.76, 0.38], mix: 1, bg: "#0a0703" },
      ];
      const bar = document.getElementById("bar");
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
      const pick = (s, b) => {
        Object.assign(window.glassLook, { tint: s.tint, tintMix: s.mix, bg: hex(s.bg) });
        document.body.style.setProperty("--bg", s.bg);
        bar.querySelectorAll("button:not(.logo)").forEach((x) => x.classList.toggle("on", x === b));
      };
      SETS.forEach((s, i) => {
        const b = document.createElement("button");
        b.style.background = s.swatch;
        b.title = s.name;
        b.onclick = () => pick(s, b);
        bar.appendChild(b);
        if (!i) pick(s, b);
      });
      // logos to try: the studio's mark and a few plain shapes
      const sep = document.createElement("i");
      sep.style.cssText = "width:1px;height:18px;background:rgba(255,255,255,0.2);margin:0 4px";
      bar.appendChild(sep);
      const LOGOS = [["firework", "Firework"], ["note", "音符"], ["spark", "星芒"], ["heart", "爱心"], ["bolt", "闪电"]];
      LOGOS.forEach(([id, name], i) => {
        const b = document.createElement("button");
        b.className = "logo" + (i ? "" : " on");
        b.title = name;
        b.style.cssText = "border-radius:7px;background:#1b1b1b center/70% no-repeat url(logos/" + id + ".svg)";
        b.onclick = () => {
          window.useLogo("logos/" + id + ".svg");
          bar.querySelectorAll("button.logo").forEach((x) => x.classList.toggle("on", x === b));
        };
        bar.appendChild(b);
      });
      const tip = document.createElement("span");
      tip.textContent = "移动鼠标转动光线 · 点画面重播 · 拖入图片换 logo";
      bar.appendChild(tip);
    </script>
  </body>
</html>
