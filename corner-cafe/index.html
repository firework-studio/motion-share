<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Cafe</title>
<style>
  html, body { margin: 0; height: 100%; background: #ebe8e2; }
  body { display: grid; place-items: center; }
  .card { width: min(92vw, calc((100vh - 48px) * 4 / 3)); aspect-ratio: var(--ar, 4 / 3); border-radius: 16px; overflow: hidden; background: #fdfcf8;
          box-shadow: 0 0 0 1px rgba(40, 34, 26, .10), 0 18px 50px -18px rgba(40, 34, 26, .35); }
  #stage, #stage svg { display: block; width: 100%; height: 100%; }
  #stage svg .pp { fill: var(--paper, #fdfdfc); }
  #stage svg text { font-family: "Noto Serif SC", "Songti SC", serif; }
  /* ?export: the card fills the window exactly, nothing round it (for frame capture) */
  html.export body { display: block; } html.export .card { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
</style>
<script>if (new URLSearchParams(location.search).has('export')) document.documentElement.classList.add('export');</script>
</head>
<body>
  <div class="card"><div id="stage"></div></div>
  <script type="module" src="./cafe.ts"></script>
</body>
</html>
