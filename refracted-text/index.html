<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>折射文字</title>
    <style>
      @font-face { font-family: "Russo One"; src: url(fonts/RussoOne-Regular.ttf) format("truetype"); }
      html, body { margin: 0; height: 100%; background: var(--bg, #050505); overflow: hidden; font: 13px/1.2 "PingFang SC", system-ui, sans-serif; color: #c9c4bf; }
      #gl { position: fixed; left: 50%; top: 46%; width: min(96vw, 270vh); height: auto; aspect-ratio: 1800 / 640; transform: translate(-50%, -50%); cursor: pointer; }
      #bar { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(8px); }
      #bar button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25); padding: 0; cursor: pointer; }
      #bar button.on { outline: 2px solid #fff; outline-offset: 2px; }
      #bar input { width: 130px; height: 24px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.4); color: #fff; padding: 0 8px; font: inherit; text-transform: uppercase; }
      #bar span { opacity: 0.7; white-space: nowrap; }
      #credit { position: fixed; right: 16px; bottom: 12px; font-size: 12px; color: #6b6560; text-decoration: none; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="bar"></div>
    <a id="credit" href="https://github.com/firework-studio/motion-share" target="_blank" rel="noopener">Made by Firework 工作室</a>
    <script src="main.js?v=6"></script>
    <script>
      // colours: the band of light, its warm and cool rays, and the page behind
      const SETS = [
        { name: "原色", swatch: "conic-gradient(#ffd27a, #ffffff, #7fb0ff, #ffd27a)", beam: [1, 1, 1], warm: [1, 0.72, 0.35], cool: [0.55, 0.7, 0.95], bg: "#050505" },
        { name: "冰蓝", swatch: "#4aa8ff", beam: [0.8, 0.92, 1], warm: [0.45, 0.85, 1], cool: [0.25, 0.45, 1], bg: "#03070d" },
        { name: "玫瑰", swatch: "#ff6f9e", beam: [1, 0.86, 0.92], warm: [1, 0.5, 0.45], cool: [0.85, 0.4, 1], bg: "#0b0306" },
        { name: "香槟金", swatch: "#e9b85c", beam: [1, 0.95, 0.82], warm: [1, 0.66, 0.25], cool: [1, 0.86, 0.5], bg: "#0a0703" },
      ];
      const bar = document.getElementById("bar");
      const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
      const input = document.createElement("input");
      input.value = "FIREWORK";
      input.maxLength = 10;
      // the word changes as it is typed (once a Chinese input method has finished composing)
      let typing = null, composing = false;
      const apply = () => { clearTimeout(typing); typing = setTimeout(() => window.setWord(input.value), 350); };
      input.addEventListener("compositionstart", () => (composing = true));
      input.addEventListener("compositionend", () => { composing = false; apply(); });
      input.addEventListener("input", () => !composing && apply());
      bar.appendChild(input);
      SETS.forEach((s, i) => {
        const b = document.createElement("button");
        b.style.background = s.swatch;
        b.title = s.name;
        b.onclick = () => {
          Object.assign(window.refractLook, { beam: s.beam, warm: s.warm, cool: s.cool, bg: hex(s.bg) });
          document.body.style.setProperty("--bg", s.bg);
          bar.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        };
        bar.appendChild(b);
        if (!i) b.classList.add("on");
      });
      const tip = document.createElement("span");
      tip.textContent = "移动鼠标拨动光线 · 点画面重播 · 输入框里直接改字";
      bar.appendChild(tip);
    </script>
  </body>
</html>
